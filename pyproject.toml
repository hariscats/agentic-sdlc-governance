[project]
name = "governed-permit-intake"
version = "0.1.0"
description = "Guardrails-as-Code reference demo"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.135.1", "uvicorn==0.41.0"]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.6",
  "mypy==1.19.1",
  "pyyaml==6.0.3",
  "types-PyYAML==6.0.12.20250915",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "governance/gates/tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["src", "governance"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "governance", "metrics", "scripts"]
exclude = ["tests"]
