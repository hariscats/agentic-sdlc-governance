name: Spec Traceability
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  trace:
    name: Spec Traceability Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Read metadata and run trusted gate
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr view "$PR" --repo "$REPO" --json author,title,body,labels,additions,deletions,closingIssuesReferences,headRefOid,latestReviews > "$RUNNER_TEMP/pr.json"
          python3 -m governance.gates.run trace --metadata "$RUNNER_TEMP/pr.json" --candidate ../candidate --base "$BASE" --head "$HEAD"
