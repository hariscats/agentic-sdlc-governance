name: Dependency Review
on: [pull_request]
permissions:
  contents: read
jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, PSF-2.0, Python-2.0, Python-2.0.1, MPL-2.0
          # Exact-version metadata correction; rationale and source license in BUILD-LOG.
          allow-dependencies-licenses: pkg:pypi/typing-extensions@4.16.0
          comment-summary-in-pr: never
