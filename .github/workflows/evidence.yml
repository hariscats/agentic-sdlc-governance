name: Evidence Inventory
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export merged PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.pr_evidence
          echo "Release evidence ZIP is built and attached by release.yml before publication." >> "$GITHUB_STEP_SUMMARY"
          echo "GITHUB_TOKEN-created releases do not recursively trigger this workflow; use manual dispatch for an additional inventory." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merged-pr-evidence
          path: .demo-state/pr-evidence.json
          include-hidden-files: true
          if-no-files-found: error
