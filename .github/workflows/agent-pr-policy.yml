name: Agent PR Policy
# pull_request_target runs this file and the gate code from the default branch, so a
# PR cannot rewrite its own gate. PR commits are fetched as Git objects for inspection
# only: never checked out, built, imported or executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
jobs:
  policy:
    name: Agent PR Policy Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run trusted gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Anonymous fetch works for this public repository; a private copy fails closed.
          git fetch --no-tags --quiet origin "$BASE" "+refs/pull/$PR/head:refs/remotes/pull/head"
          gh pr view "$PR" --repo "$REPO" --json author,title,body,labels,additions,deletions,closingIssuesReferences,headRefOid > "$RUNNER_TEMP/pr.json"
          python3 -m governance.gates.run agent --metadata "$RUNNER_TEMP/pr.json" --candidate . --base "$BASE" --head "$HEAD"
