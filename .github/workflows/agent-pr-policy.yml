name: Agent PR Policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
jobs:
  policy:
    name: Agent PR Policy Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Run trusted policy
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr view "$PR" --repo "$REPO" --json author,title,body,labels,additions,deletions,closingIssuesReferences,headRefOid,latestReviews > "$RUNNER_TEMP/pr.json"
          gh api --method GET "repos/$REPO/pulls/$PR/reviews?per_page=100" --paginate --slurp | jq 'add // []' > "$RUNNER_TEMP/reviews.json"
          python3 -m governance.gates.run agent --metadata "$RUNNER_TEMP/pr.json" --reviews "$RUNNER_TEMP/reviews.json" --candidate ../candidate --base "$BASE" --head "$HEAD"
