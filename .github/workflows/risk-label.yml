name: Risk Label
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout or execution of PR code; only metadata handled as JSON.
      - name: Label conservative path risk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$REPO" --json files,changedFiles > "$RUNNER_TEMP/files.json"
          risk=$(python3 - "$RUNNER_TEMP/files.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          paths = [f["path"].casefold() for f in data["files"]]
          protected = (".github/", "governance/", ".specify/", "scripts/", "agents.md", "pyproject.toml", "uv.lock")
          high = data["changedFiles"] != len(paths) or any(p.startswith(protected) or "auth" in p or "crypto" in p for p in paths)
          print("high" if high else "medium" if any(p.startswith("src/") for p in paths) else "low")
          PY
          )
          for label in risk:low risk:medium risk:high; do
            gh pr edit "$PR" --repo "$REPO" --remove-label "$label"
          done
          gh pr edit "$PR" --repo "$REPO" --add-label "risk:$risk"
