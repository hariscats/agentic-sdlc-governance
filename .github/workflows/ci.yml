name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install uv==0.11.14
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests governance metrics scripts
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest --cov --cov-report=xml --junitxml=junit.xml
      - run: uv run --frozen python -m scripts.validate_repository
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-evidence
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: error
