name: Release
# Builds and signs the permit API source from main. The demo verifies the artifact with
# `gh attestation verify --signer-workflow <repo>/.github/workflows/release.yml
# --source-ref refs/heads/main`, so keep this file's path stable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build source zip and checksum
        run: |
          git archive --format=zip --output=permit-intake.zip HEAD pyproject.toml uv.lock src
          python3 -c 'import hashlib, json; digest = hashlib.sha256(open("permit-intake.zip", "rb").read()).hexdigest(); print(json.dumps({"permit-intake.zip": digest}, indent=2))' > checksums.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            permit-intake.zip
            checksums.json
          if-no-files-found: error
  attest:
    # Signing is isolated: no checkout and no repository code, only the built bytes.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: candidate
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/permit-intake.zip
